name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        run: |
          if [ -d "tests" ]; then pytest -v; else echo "No tests directory, skipping."; fi

  # End-to-end pipeline smoke test on a small SYNTHETIC dataset (no real data
  # needed). Proves steps 1-3 actually run, not just import.
  pipeline-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic sample data
        run: python scripts/make_sample_data.py --out ci_data/raw --rows-per-file 400

      - name: Step 1 - load & clean
        run: python step1_load_clean.py ci_data/raw ci_data/clean.csv

      - name: Step 2 - XGBoost baseline (2-fold)
        run: python step2_baseline.py ci_data/clean.csv --folds 2

      - name: Step 3 - alerts & ATT&CK correlation
        run: python step3_alerts.py outputs/predictions.csv

      - name: Validate output artifacts
        run: python scripts/validate_outputs.py
