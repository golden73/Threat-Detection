<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AEGIS · Threat Detection Dashboard</title>
<meta name="description" content="Live dashboard for the AI-Assisted Threat Detection & Response System">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l11 4v9c0 7-4.7 12.4-11 15C9.7 27.4 5 22 5 15V6l11-4z' fill='%235b9bff'/%3E%3Cpath d='M11 16l3.5 3.5L21 12' fill='none' stroke='%230d0f12' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/overview">
      <span class="brand-mark">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l11 4v9c0 7-4.7 12.4-11 15C9.7 27.4 5 22 5 15V6l11-4z" fill="currentColor"/><path d="M11 16l3.5 3.5L21 12" fill="none" stroke="#0d0f12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-text">
        <b>AEGIS</b>
        <small>Threat Detection</small>
      </span>
    </a>

    <nav class="nav" aria-label="Main">
      <a class="nav-item" href="#/overview" data-nav="overview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Overview</span>
      </a>
      <a class="nav-item" href="#/alerts" data-nav="alerts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10.3 21a2 2 0 003.4 0"/></svg>
        <span>Alerts</span>
        <em class="nav-count" id="nav-alerts">–</em>
      </a>
      <a class="nav-item" href="#/incidents" data-nav="incidents">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 4.5v5c0 5.2-3.7 8.6-9 9.5-5.3-.9-9-4.3-9-9.5v-5L12 3z"/><path d="M12 8v4"/><circle cx="12" cy="16" r=".6"/></svg>
        <span>Incidents</span>
        <em class="nav-count" id="nav-incidents">–</em>
      </a>
      <a class="nav-item" href="#/reports" data-nav="reports">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8l-5-5z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
        <span>AI Reports</span>
        <em class="nav-count" id="nav-reports">–</em>
      </a>
      <a class="nav-item" href="#/evaluation" data-nav="evaluation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18"/><path d="M6 20V10M12 20V4M18 20v-7"/></svg>
        <span>Evaluation</span>
      </a>
      <a class="nav-item" href="#/pipeline" data-nav="pipeline">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
        <span>Pipeline</span>
        <span class="nav-dot" id="nav-pipeline-dot" hidden></span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="dataset-chip">
        <span class="dataset-dot"></span>
        <div>
          <b>CICIDS2017</b>
          <small>3 captures · 957K flows</small>
        </div>
      </div>
      <a class="mini-link" href="/demo.html" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7M21 3l-9 9"/><path d="M19 14v5a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h5"/></svg>
        One-page demo
      </a>
      <p class="foot-note">Local-only · no API keys needed</p>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menu-btn" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="cruft">
        <span class="crumb" id="crumb">Overview</span>
      </div>
      <div class="top-actions">
        <span class="run-pill" id="run-pill" data-state="idle">
          <i></i><span id="run-pill-text">Idle</span>
        </span>
        <button class="icon-btn" id="refresh-btn" title="Refresh data" aria-label="Refresh data">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 11-2.6-6.4M21 3v6h-6"/></svg>
        </button>
        <button class="icon-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <div id="view" class="view" aria-live="polite"></div>
  </main>
</div>

<div class="drawer-wrap" id="drawer" hidden>
  <div class="drawer-scrim" data-close-drawer></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <button class="drawer-close" data-close-drawer aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="drawer-body"></div>
  </aside>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
